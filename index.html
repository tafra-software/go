<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TAFRA Smart QR</title>
    <link rel="preconnect" href="https://go-tafra.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://go-tafra.vercel.app" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #090d16;
        color: #f8fafc;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 24px 20px max(1.25rem, env(safe-area-inset-bottom));
        overflow: hidden;
      }
      /* Top edge NProgress-style quick bar */
      .top-bar-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.05);
        z-index: 50;
      }
      .top-bar-fill {
        height: 100%;
        width: 12%;
        background: linear-gradient(90deg, #00c4d6, #38bdf8, #00c4d6);
        background-size: 200% 100%;
        box-shadow: 0 0 12px rgba(0, 196, 214, 0.8);
        transition: width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        animation: barGlow 1.2s linear infinite;
      }
      @keyframes barGlow {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .center-box {
        margin: auto;
        width: 100%;
        max-width: 310px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .logo-pill {
        height: 52px;
        padding: 0 22px;
        border-radius: 18px;
        background: #0f172a;
        border: 1px solid rgba(0, 196, 214, 0.35);
        box-shadow: 0 0 28px rgba(0, 196, 214, 0.16);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .logo-pill img {
        height: 20px;
        width: auto;
        object-fit: contain;
      }
      .status-label {
        font-size: 14px;
        font-weight: 700;
        color: #e2e8f0;
        letter-spacing: 0.01em;
      }
      .bar-container {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }
      .bar-fill {
        height: 100%;
        width: 15%;
        border-radius: 999px;
        background: linear-gradient(90deg, #00c4d6, #38bdf8, #00c4d6);
        background-size: 200% 100%;
        box-shadow: 0 0 14px rgba(0, 196, 214, 0.6);
        transition: width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        animation: barGlow 1.1s linear infinite;
      }
      .footer-wrap {
        display: flex;
        justify-content: center;
      }
      .tafra-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(8, 13, 22, 0.95);
        border: 1px solid rgba(0, 196, 214, 0.4);
        box-shadow: 0 4px 20px rgba(0, 196, 214, 0.16);
        direction: ltr;
      }
      .tafra-badge span {
        font-size: 11px;
        font-weight: 600;
        color: #cbd5e1;
        letter-spacing: 0.02em;
      }
      .tafra-badge img {
        height: 14px;
        width: auto;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="top-bar-track">
      <div id="topBar" class="top-bar-fill"></div>
    </div>

    <div class="center-box">
      <div class="logo-pill">
        <img src="/go/tafra-logo.png" alt="TAFRA" />
      </div>
      <p class="status-label">جاري التحويل...</p>
      <div class="bar-container" dir="ltr">
        <div id="mainBar" class="bar-fill"></div>
      </div>
    </div>

    <div class="footer-wrap">
      <div class="tafra-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00c4d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="5" height="5" x="3" y="3" rx="1"/>
          <rect width="5" height="5" x="16" y="3" rx="1"/>
          <rect width="5" height="5" x="3" y="16" rx="1"/>
          <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
          <path d="M21 21v.01"/>
          <path d="M12 7v3a2 2 0 0 1-2 2H7"/>
          <path d="M3 12h.01"/>
          <path d="M12 3h.01"/>
          <path d="M12 16v.01"/>
          <path d="M16 12h1"/>
          <path d="M21 12v.01"/>
          <path d="M12 21v-1"/>
        </svg>
        <span>Powered by</span>
        <img src="/go/tafra-logo.png" alt="TAFRA" />
      </div>
    </div>

    <script type="text/javascript">
      (function () {
        var mainBar = document.getElementById("mainBar");
        var topBar = document.getElementById("topBar");
        var pct = 18;

        function setPct(val) {
          pct = val;
          if (mainBar) mainBar.style.width = pct + "%";
          if (topBar) topBar.style.width = pct + "%";
        }

        // Immediate jump to 75% then trickle smoothly up to 97% so it stays at the end even on slow connections
        requestAnimationFrame(function () {
          setPct(76);
        });

        var trickle = setInterval(function () {
          if (pct < 92) {
            setPct(pct + 6);
          } else if (pct < 97.5) {
            setPct(pct + 0.6);
          }
        }, 120);

        var targetOrigin = "https://go-tafra.vercel.app";
        var path = window.location.pathname || "/";
        var subPath = path.replace(/^\/go(\/|$)/i, "/");
        if (!subPath.startsWith("/")) {
          subPath = "/" + subPath;
        }
        var destination =
          targetOrigin +
          subPath +
          (window.location.search || "") +
          (window.location.hash || "");

        setTimeout(function () {
          setPct(96);
          window.location.replace(destination);
        }, 260);
      })();
    </script>
  </body>
</html>
